<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GVC TPO Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #0b1220;
  --bg2: #111a2b;
  --panel: #152033;
  --panel2: #1a2740;
  --border: #2a3b57;
  --text: #e8eef8;
  --muted: #8fa3c0;
  --gold: #d4a84b;
  --gold2: #f0c56d;
  --navy: #1e3a5f;
  --red: #e85d5d;
  --green: #3ecf8e;
  --blue: #5b8def;
  --shadow: 0 8px 28px rgba(0,0,0,.35);
  --radius: 10px;
  --font: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  background: radial-gradient(1200px 600px at 10% -10%, #1a2a48 0%, var(--bg) 55%);
  color: var(--text);
  font-size: 14px;
  line-height: 1.45;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
#app { min-height: 100%; display: flex; flex-direction: column; }
.topbar {
  display: grid;
  grid-template-columns: 240px 1fr auto;
  gap: 16px;
  align-items: center;
  padding: 12px 18px;
  background: rgba(11,18,32,.92);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20;
  backdrop-filter: blur(8px);
}
.brand { display: flex; gap: 10px; align-items: center; }
.brand-mark {
  width: 36px; height: 36px; border-radius: 8px;
  background: linear-gradient(145deg, var(--gold), #9a6f1f);
  color: #1a1205; font-weight: 700; display: grid; place-items: center;
  letter-spacing: .04em;
}
.brand strong { display: block; font-size: 14px; }
.brand span { color: var(--muted); font-size: 11px; }
.op-sentence {
  margin: 0; text-align: center; color: var(--gold2);
  font-size: 12.5px; font-weight: 500; letter-spacing: .01em;
}
.top-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--border); background: var(--panel);
  border-radius: 8px; padding: 7px 12px; color: var(--text);
}
.btn:hover { border-color: #3d5378; background: var(--panel2); }
.btn-primary {
  background: linear-gradient(180deg, var(--gold2), var(--gold));
  color: #1a1205; border-color: transparent; font-weight: 600;
}
.btn-primary:hover { filter: brightness(1.05); }
.btn-ghost { background: transparent; }
.btn-danger { color: var(--red); border-color: #5a2a2a; }
.nav {
  display: flex; gap: 4px; padding: 8px 14px;
  border-bottom: 1px solid var(--border); background: var(--bg2);
  overflow-x: auto;
}
.nav-item {
  border: 0; background: transparent; color: var(--muted);
  padding: 8px 12px; border-radius: 8px; white-space: nowrap; font-weight: 500;
}
.nav-item:hover { color: var(--text); background: rgba(255,255,255,.04); }
.nav-item.active { color: #1a1205; background: var(--gold); }
.main { padding: 18px; max-width: 1400px; width: 100%; margin: 0 auto; flex: 1; }
.view-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; margin-bottom: 14px; }
.view-head h1 { margin: 0; font-size: 22px; font-weight: 650; }
.view-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.grid { display: grid; gap: 12px; }
.grid-2 { grid-template-columns: 1.1fr .9fr; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 1100px) {
  .topbar { grid-template-columns: 1fr; }
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  .op-sentence { text-align: left; }
}
.card {
  background: linear-gradient(180deg, var(--panel), var(--panel2));
  border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 14px;
}
.card h3 { margin: 0 0 8px; font-size: 14px; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12px; }
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
  border: 1px solid var(--border); background: rgba(0,0,0,.2);
}
.tag.red { color: #ffb4b4; border-color: #6b3030; background: rgba(232,93,93,.12); }
.tag.gold { color: var(--gold2); border-color: #6b5420; background: rgba(212,168,75,.12); }
.tag.green { color: #b6f0d2; border-color: #2a6b4c; background: rgba(62,207,142,.12); }
.tag.blue { color: #b9d0ff; border-color: #2f4d80; background: rgba(91,141,239,.12); }
.list { display: flex; flex-direction: column; gap: 8px; }
.row {
  display: flex; gap: 12px; align-items: flex-start; justify-content: space-between;
  padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: rgba(0,0,0,.18);
}
.row:hover { border-color: #3d5378; }
.row.clickable { cursor: pointer; }
.row-main { min-width: 0; flex: 1; }
.row-main strong { display: block; margin-bottom: 2px; }
.kpi {
  padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: rgba(0,0,0,.2);
}
.kpi .n { font-size: 24px; font-weight: 700; color: var(--gold2); }
.kpi .l { color: var(--muted); font-size: 12px; margin-top: 2px; }
.bar {
  height: 8px; background: #0a101c; border-radius: 99px; overflow: hidden; border: 1px solid var(--border);
}
.bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); }
.ladder {
  display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px;
}
.rung {
  font-size: 10px; padding: 3px 6px; border-radius: 4px;
  border: 1px solid var(--border); color: var(--muted);
}
.rung.on { color: #1a1205; background: var(--gold); border-color: transparent; font-weight: 600; }
.rung.done { color: var(--green); border-color: #2a6b4c; }
.form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.form-row label { font-size: 12px; color: var(--muted); font-weight: 500; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
input, select, textarea {
  width: 100%; padding: 8px 10px; border-radius: 8px;
  border: 1px solid var(--border); background: #0c1422;
}
input:focus, select:focus, textarea:focus { outline: 1px solid var(--gold); border-color: var(--gold); }
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(3,8,18,.72);
  display: grid; place-items: center; z-index: 50; padding: 16px;
}
.modal-backdrop.hidden { display: none; }
.modal {
  width: min(560px, 100%); background: var(--panel); border: 1px solid var(--border);
  border-radius: 12px; box-shadow: var(--shadow); max-height: 90vh; overflow: auto;
}
.modal-h { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.modal-h h2 { margin: 0; font-size: 16px; }
.modal-b { padding: 16px; }
.modal-f { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
.icon-btn { border: 0; background: transparent; color: var(--muted); font-size: 20px; line-height: 1; }
.split { display: grid; grid-template-columns: 320px 1fr; gap: 12px; }
@media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
.shop-item {
  padding: 10px 12px; border-radius: 8px; border: 1px solid transparent; cursor: pointer;
}
.shop-item:hover, .shop-item.active { background: rgba(212,168,75,.08); border-color: #5a4a22; }
.check { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; }
.check input { width: auto; margin-top: 3px; }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th, .table td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
.table th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.empty { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--border); border-radius: 8px; }
.req { color: var(--red); }
.pill-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.updates-teaser {
  border: 1px solid #6b5420;
  background: linear-gradient(135deg, var(--navy) 0%, #152033 55%, rgba(212,168,75,.18) 100%);
  cursor: pointer;
  margin-bottom: 14px;
}
.updates-teaser:hover { border-color: var(--gold); }
.updates-teaser h3 { margin: 0 0 4px; color: var(--gold2); font-size: 15px; }
.updates-teaser .teaser-meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
.activity-board { margin-top: 22px; }
.activity-board > h2 {
  margin: 0 0 6px; font-size: 17px; color: var(--gold2); font-weight: 650;
}
.activity-card .pillar {
  font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
  color: var(--gold); font-weight: 600; margin-bottom: 4px;
}
.activity-card .why { color: var(--muted); font-size: 12.5px; margin: 6px 0 10px; }
.activity-meta { display: flex; flex-wrap: wrap; gap: 6px; }

.dk-preview {
  background: #0a101c; border: 1px solid var(--border); border-radius: 8px;
  padding: 12px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap;
  max-height: 320px; overflow: auto; color: #d6e2f5;
}
.dk-html-preview {
  background: #f7f4ee; color: #1a1205; border: 1px solid var(--border);
  border-radius: 8px; padding: 12px; max-height: 320px; overflow: auto;
}
.dk-html-preview table { width: 100%; border-collapse: collapse; font-size: 13px; }
.dk-html-preview th, .dk-html-preview td {
  border: 1px solid #c9b896; padding: 6px 8px; text-align: left;
}
.dk-html-preview th { background: #ebe3d3; }
.dk-warn {
  border: 1px solid #6b5420; background: rgba(212,168,75,.1);
  border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; color: var(--gold2);
  font-size: 12.5px;
}
.dk-doors input { font-size: 12.5px; padding: 6px 8px; }
.volume-block { margin-top: 18px; }
.volume-block ul { margin: 8px 0 0; padding-left: 18px; color: var(--text); }
.volume-block li { margin: 4px 0; }
.lane-reminder {
  border: 1px dashed #3d5378; background: rgba(91,141,239,.08);
  border-radius: 8px; padding: 10px 12px; margin-bottom: 12px;
}



</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">GVC</div>
      <div><strong>TPO Command Center</strong><span>Internal broker OS · 11 approved shops</span></div>
    </div>
    <p class="op-sentence">Know the shop. Find the producer. Earn the scenario. Win the first file. Ask for the second.</p>
    <div class="top-actions">
      <button class="btn btn-ghost" id="btnExport">Export</button>
      <button class="btn btn-ghost" id="btnImport">Import</button>
      <button class="btn btn-ghost btn-danger" id="btnReset">Reset</button>
      <button class="btn btn-primary" id="btnLog">Log conversation</button>
    </div>
  </header>
  <nav class="nav" id="nav"></nav>
  <main class="main" id="main"></main>
</div>

<div class="modal-backdrop hidden" id="modalLog">
  <div class="modal">
    <div class="modal-h"><h2>Log conversation</h2><button class="icon-btn" id="closeLog" aria-label="Close">&times;</button></div>
    <form class="modal-b" id="formLog">
      <div class="form-row"><label>Shop <span class="req">*</span></label><select id="logShop" required></select></div>
      <div class="form-row"><label>Rung change (optional)</label><select id="logRung"><option value="">— no change —</option></select></div>
      <div class="form-row"><label>Outcome type <span class="req">*</span></label>
        <select id="logOutcome" required>
          <option value="loan_moved">Loan opportunity moved closer to GVC</option>
          <option value="feedback">Broker feedback improves product/process</option>
        </select>
      </div>
      <div class="form-row"><label>Notes / intelligence</label><textarea id="logNotes" rows="3" placeholder="What did we learn?"></textarea></div>
      <div class="form-row"><label>Next step — What <span class="req">*</span></label><input id="logNext" required placeholder="What happens next?" /></div>
      <div class="form-grid">
        <div class="form-row"><label>Who owns it <span class="req">*</span></label><input id="logOwner" required /></div>
        <div class="form-row"><label>By date <span class="req">*</span></label><input id="logDate" type="date" required /></div>
      </div>
      <div class="modal-f" style="padding:0;border:0;margin-top:8px">
        <button type="button" class="btn btn-ghost" id="cancelLog">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>
<input type="file" id="importFile" accept="application/json" hidden />

<script>
const STORAGE_KEY = "gvc-tpo-command-center-v1";
const VIEWS = [
  ["today","Today"],["updates","Updates"],["doorkick","Door-kick"],["shops","Shops"],["fastlane","Fast Lane"],["rooms","Rooms"],
  ["rhythm","Rhythm"],["campaigns","Campaigns"],["feedback","Feedback"],["scoreboard","Scoreboard"]
];
const RUNGS = [
  "Responded","Discovery conversation","Producer introduction","Scenario identified",
  "GVC comparison completed","First-file commitment","Submitted","Funded","Second loan identified"
];
const CAMPAIGN_TYPES = [
  "First File Challenge","Meet the Producers","Difficult Loan Week","Lost Loan Debrief",
  "Processor Partnership","Second Loan Sprint","Dormant Shop Reset"
];
const OWNER_OPENER = "Who on your team is most likely to have the kind of loan where GVC could prove itself? Would you mind making a quick introduction?";
const FASTLANE_INVITE = "Let's identify one file where GVC has a legitimate chance to prove itself. I'll help map the product, documentation, pricing, contacts, and next step so your first submission doesn't feel like an experiment.";
const FASTLANE_CHECKS = [
  ["scenarioReview","10-min scenario review"],
  ["comparison","Side-by-side execution comparison"],
  ["portalHelp","Portal assistance"],
  ["opsContact","Named ops contact"],
  ["milestones","Proactive milestone communication"],
  ["debrief","Post-close debrief"],
  ["secondAsk","Immediate request for second opportunity"]
];

const state = { view: "today", selectedShopId: null, data: null };

function isoDate(d=new Date()){ return d.toISOString().slice(0,10); }
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return isoDate(d); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c])); }
function parseDate(s){ return s ? new Date(s+"T12:00:00") : null; }
function isPast(s){ const d=parseDate(s); return d && d < new Date(new Date().toDateString()); }
function weekday(){ return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date().getDay()]; }

function seedShops(){
  const base = [
    ["Horizon Home Lending","Carmel, IN",2],
    ["Keystone Mortgage Group","Indianapolis, IN",4],
    ["Northbridge Brokers","Fort Wayne, IN",6],
    ["Summit Street Lending","Fishers, IN",3],
    ["Prairie State Mortgage","Bloomington, IN",1],
    ["Lakeside Loan Partners","South Bend, IN",5],
    ["Capitol Avenue Home Loans","Anderson, IN",7],
    ["Maple & Main Mortgage","Muncie, IN",2],
    ["River Bend Funding","Evansville, IN",8],
    ["Crossroads Brokerage","Lafayette, IN",3],
    ["Pendleton Peak Lending","Pendleton, IN",9]
  ];
  const people = [
    [["Dana Whitfield","Owner"],["Marcus Lee","LO"],["Priya Shah","LO"],["Elena Ruiz","Processor"]],
    [["Tom Harlan","Owner"],["Jamie Cole","LO"],["Noah Price","LO"],["Kim Orth","LOA"]],
    [["Sara Nguyen","Owner"],["Chris Bell","LO"],["Ava Monroe","LO"],["Rick Hale","Ops"]],
    [["Brett Owens","Owner"],["Lila Grant","LO"],["Omar Diaz","LO"],["Nancy Pike","Processor"]],
    [["Helen Cho","Owner"],["Drew Samuels","LO"],["Maya Trent","LO"],["Gus Klein","LOA"]],
    [["Ian Brooks","Owner"],["Tara Quinn","LO"],["Ben Asher","LO"],["Jill Mooney","Ops"]],
    [["Carol Vance","Owner"],["Pete Romano","LO"],["Zoe Hart","LO"],["Ann Keller","Processor"]],
    [["Greg Mills","Owner"],["Sasha Ford","LO"],["Evan Moss","LO"],["Dee Patel","LOA"]],
    [["Nina Ortega","Owner"],["Kyle Reed","LO"],["Hannah Wu","LO"],["Paul Greer","Ops"]],
    [["Ray Simmons","Owner"],["Ivy Chen","LO"],["Jordan Blake","LO"],["Meg Stanton","Processor"]],
    [["Alex Voyles","Owner"],["Casey Dunn","LO"],["Riley Parks","LO"],["Pat Gomez","LOA"]]
  ];
  const lenders = ["Rocket/UWM mix","Local CU + UWM","PennyMac heavy","UWM exclusive habit","Mixed retail/broker","Freedom + UWM","Local bank loyalty","Newrez primary","Self-serve portals","Wholesale patchwork","GVC + backup"];
  const opps = ["Self-employed DSCR gaps","Investor cash-out","Thin-file FTHB","Rural USDA overlays","Credit-event purchase","Non-QM bridge","Condo warrantability","Bank statement loans","VA IRRRL + purchase","Jumbo near limits","Second home quirks"];

  return base.map((b,i)=>{
    const p = people[i];
    const rung = b[2];
    const funded = rung >= 8;
    const hasNext = i !== 4 && i !== 7; // two red shops missing dated next step
    return {
      id: "shop-"+ (i+1),
      name: b[0], city: b[1], rung,
      relationships: {
        owner: { name: p[0][0], role: p[0][1] },
        lo1: { name: p[1][0], role: p[1][1] },
        lo2: { name: p[2][0], role: p[2][1] },
        ops: { name: p[3][0], role: p[3][1] }
      },
      opportunity: opps[i],
      lenderLoyalty: lenders[i],
      nextStep: hasNext ? {
        what: rung < 4 ? "Book discovery / producer intro" : rung < 6 ? "Run GVC comparison on live file" : rung < 8 ? "Push submission / clear conditions" : "Ask for second loan",
        who: i % 2 ? "Brock" : p[0][0],
        date: addDays((i % 5) - 1)
      } : { what: "", who: "", date: "" },
      fastLane: {
        scenarioReview: rung >= 4,
        comparison: rung >= 5,
        portalHelp: rung >= 6,
        opsContact: rung >= 6,
        milestones: rung >= 7,
        debrief: funded,
        secondAsk: rung >= 9
      },
      campaignProgress: i % 3,
      conversations: [],
      losses: rung === 3 ? [{ reason: "Pricing lost to UWM special", date: addDays(-12) }] : [],
      fundings: funded ? [{ date: addDays(-20), secondAsk: rung >= 9 }] : []
    };
  });
}

function seedData(){
  const shops = seedShops();
  const start = addDays(-3);
  const end = addDays(11);
  return {
    version: 1,
    shops,
    conversations: [
      { id: uid(), shopId: shops[1].id, at: addDays(-1), outcome: "loan_moved", notes: "Scenario on self-employed borrower; docs list agreed.", rungAfter: 4, next: shops[1].nextStep, meaningful: true },
      { id: uid(), shopId: shops[2].id, at: addDays(-2), outcome: "loan_moved", notes: "Portal walkthrough with ops.", rungAfter: 6, next: shops[2].nextStep, meaningful: true }
    ],
    rooms: [
      { id: "room-tue", label: "Tue 11:00–11:30", day: "Tue", invites: [
        { shopId: shops[1].id, person: "Jamie Cole" },
        { shopId: shops[3].id, person: "Lila Grant" },
        { shopId: shops[5].id, person: "Tara Quinn" }
      ], known: "Two purchase files with income complexity", needsConfirm: "Property type / condo questionnaire", gvcPath: "Likely on bank-statement option", owner: "Brock", hearBack: addDays(2) },
      { id: "room-thu", label: "Thu 11:00–11:30", day: "Thu", invites: [
        { shopId: shops[0].id, person: "Marcus Lee" },
        { shopId: shops[9].id, person: "Ivy Chen" }
      ], known: "", needsConfirm: "", gvcPath: "", owner: "", hearBack: "" }
    ],
    rhythm: {
      weekOf: isoDate(),
      mon: { done: false, uncertainty: "", shopId: "", notes: "" },
      tue: { done: false, notes: "" },
      wed: { done: false, notes: "" },
      thu: { done: false, insight: "" },
      fri: { done: false, notes: "" }
    },
    campaign: {
      type: "First File Challenge",
      start, end,
      objective: "One submission commitment from each shop not yet funded",
      notes: "Use Fast Lane invite verbatim."
    },
    feedback: [
      { id: uid(), shopId: shops[4].id, category: "documentation friction", detail: "Bank-statement worksheet too heavy for LOAs", status: "open", response: "", created: addDays(-6) },
      { id: uid(), shopId: shops[6].id, category: "pricing objections", detail: "Lost a VA purchase on rate", status: "brought", response: "", created: addDays(-4) },
      { id: uid(), shopId: shops[2].id, category: "portal/submission friction", detail: "Condition uploads timing out", status: "closed", response: "IT patched upload timeout; retry with chrome.", created: addDays(-10) }
    ],
    updates: defaultUpdates(),
    doorKick: defaultDoorKick()
  };
}

function defaultActivities(){
  return [
    { id: "act-know-shop", pillar: "Know the shop", title: "Know the shop", why: "Refresh opportunity, lender loyalty, and relationship map so every call advances a file.", owner: "Inside AE / TPO Desk", cadence: "Weekly — priority shops" },
    { id: "act-morning-4", pillar: "Know the shop", title: "Morning 4-shop plan", why: "Named daily shop lane keeps coverage tight and dated next steps current.", owner: "Inside AE / TPO Desk", cadence: "Daily — 4 named shops" },
    { id: "act-ask-solve", pillar: "Earn the scenario", title: "Ask / Solve / Match / Teach / Advance", why: "Structured talk track turns airtime into scenarios, comparisons, and dated next steps.", owner: "Inside AE / TPO Desk", cadence: "Every meaningful broker conversation" },
    { id: "act-approval-access", pillar: "Know the shop", title: "Approval & access", why: "Portal, AE assignment, and lock-desk access remove blockers before the first file.", owner: "Inside AE / TPO Desk", cadence: "On onboarding + any access gap" },

function ensureUpdates(d){
  if (!d.updates || typeof d.updates !== "object") d.updates = defaultUpdates();
  // Person-named win cards are retired; activity board data is the source of truth.
  d.updates.wins = [];
  if (!d.updates.headline || /Task wins|Jim|Ashley|Casey/i.test(d.updates.headline)) {
    d.updates.headline = "Drive volume — this week’s activity board";
  }
  if (!d.updates.asOf) d.updates.asOf = isoDate();
  const defs = defaultActivities();
  if (!Array.isArray(d.updates.activities) || d.updates.activities.length < defs.length) {
    const byId = Object.fromEntries((d.updates.activities||[]).map(a => [a.id, a]));
    d.updates.activities = defs.map(a => byId[a.id] || a);
  } else if (!d.updates.activities.some(a => a.id === "act-doorkick")) {
    d.updates.activities.push(defs.find(a => a.id === "act-doorkick"));
  }
  if (!Array.isArray(d.updates.volumeActivities) || !d.updates.volumeActivities.length) {
    d.updates.volumeActivities = defaultVolumeActivities();
  }
  return ensureDoorKick(d);
}

function ensureDoorKick(d){
  const def = defaultDoorKick();
  if (!d.doorKick || typeof d.doorKick !== "object") {
    d.doorKick = def;
    return d;
  }
  if (!Array.isArray(d.doorKick.products) || d.doorKick.products.length < 3) {
    d.doorKick.products = def.products;
  } else {
    d.doorKick.products = d.doorKick.products.map(p => ({
      product: p.product || "",
      rate: p.rate || "",
      points: p.points || "",
      note: p.note || ""
    }));
    while (d.doorKick.products.length < 3) d.doorKick.products.push({ product:"", rate:"", points:"", note:"" });
    if (d.doorKick.products.length > 5) d.doorKick.products = d.doorKick.products.slice(0,5);
  }
  if (!d.doorKick.cta) d.doorKick.cta = def.cta;
  if (!d.doorKick.subjectTemplate) d.doorKick.subjectTemplate = def.subjectTemplate;
  if (!Array.isArray(d.doorKick.guidelines) || !d.doorKick.guidelines.length) d.doorKick.guidelines = def.guidelines;
  if (typeof d.doorKick.attachNote !== "boolean") d.doorKick.attachNote = def.attachNote;
  if (!d.doorKick.rateBlockLabel) d.doorKick.rateBlockLabel = def.rateBlockLabel;
  if (!d.doorKick.compliance) d.doorKick.compliance = def.compliance;
  return d;
}

function hasDatedNext(shop){ return !!(shop.nextStep && shop.nextStep.date && shop.nextStep.what); }
function rungName(n){ return RUNGS[(n||1)-1] || "—"; }

function fastLaneBucket(shop){
  if (shop.rung >= 8) return null;
  if (!shop.fastLane.scenarioReview && shop.rung < 4) return 0;
  if (!shop.fastLane.comparison && shop.rung < 5) return 1;
  if (shop.rung < 6) return 2;
  if (shop.rung === 6) return 3;
  if (shop.rung === 7) return 4;
  return 2;
}
const BUCKET_LABELS = ["No scenario","No comparison","No commitment","Committed not submitted","Submitted not funded"];

function buildTodayTasks(){
  const tasks = [];
  const d = state.data;
  d.shops.forEach(s => {
    if (!hasDatedNext(s)) tasks.push({ severity:"red", title: s.name + " — no dated next step", detail: "Every shop needs What / Who / By when.", view:"shops", shopId:s.id });
    else if (isPast(s.nextStep.date)) tasks.push({ severity:"red", title: s.name + " — next step overdue", detail: s.nextStep.what + " · " + s.nextStep.who, view:"shops", shopId:s.id });
  });
  d.shops.filter(s => s.rung < 8).forEach(s => {
    const b = fastLaneBucket(s);
    if (b !== null && b <= 2) tasks.push({ severity:"gold", title: "Fast Lane: " + s.name, detail: BUCKET_LABELS[b], view:"fastlane", shopId:s.id });
  });
  const wd = weekday();
  const rhythmMap = { Mon:"mon", Tue:"tue", Wed:"wed", Thu:"thu", Fri:"fri" };
  if (rhythmMap[wd] && !d.rhythm[rhythmMap[wd]].done) {
    const titles = { Mon:"Rhythm — What's on your desk?", Tue:"Rhythm — Scenario / comparison talks", Wed:"Rhythm — Scenario / comparison talks", Thu:"Rhythm — One Useful Thing", Fri:"Rhythm — Close loops" };
    tasks.push({ severity:"blue", title: titles[wd], detail: "Complete today's broker rhythm card.", view:"rhythm" });
  }
  d.rooms.forEach(r => {
    if (r.day === wd || (!r.invites.length)) {
      tasks.push({ severity:"blue", title: "Scenario Room — " + r.label, detail: (r.invites.length? r.invites.length+" invites":"Invite 2–3 producers") , view:"rooms" });
    }
  });
  tasks.push({ severity:"gold", title: "Campaign: " + d.campaign.type, detail: d.campaign.objective, view:"campaigns" });
  d.feedback.filter(f => f.status !== "closed").forEach(f => {
    const shop = d.shops.find(s => s.id === f.shopId);
    tasks.push({ severity:"blue", title: "Open feedback — " + (shop?shop.name:"Shop"), detail: f.detail, view:"feedback" });
  });
  return tasks;
}

function buildDoorKickPlain(shopName, opener, cta, subject, rows, guidelines, attachNote, asOf, compliance, rateLabel){
  const filled = rows.filter(r => (r.product||"").trim() || (r.rate||"").trim());
  const lines = [];
  lines.push(opener.trim() || ("Quick doors for " + shopName + " —"));
  lines.push("");
  lines.push(rateLabel || "Paste from Secondary / lock desk — not Sales Desk Matrix");
  lines.push("As of: " + (asOf || isoDate()));
  lines.push("");
  lines.push("Product | Rate | Points/Price | Note");
  lines.push("------- | ---- | ------------ | ----");
  filled.forEach(r => {
    lines.push([r.product||"—", r.rate||"—", r.points||"—", r.note||""].join(" | "));
  });
  lines.push("");
  if (guidelines && guidelines.length) {
    lines.push("Guideline doors (longer-lived cues — SAMPLE / editable):");
    guidelines.filter(g => (g||"").trim()).forEach(g => lines.push("• " + g.trim()));
    lines.push("");
  }
  if (cta && cta.trim()) lines.push(cta.trim());
  if (attachNote) {
    lines.push("");
    lines.push("(Full rate sheet attached if useful — doors above are the quick read.)");
  }
  lines.push("");
  lines.push(compliance || "Rates/pricing subject to change without notice. Lock with Secondary.");
  return lines.join("\n");
}

function renderScoreboard(){
  const shops = state.data.shops;
  const withNext = shops.filter(hasDatedNext).length;
  const relOk = shops.filter(s => mappedCount(s) >= 3).length;
  const weekAgo = addDays(-7);
  const convos = state.data.conversations.filter(c => c.at >= weekAgo && c.meaningful);
  const scenarios = shops.filter(s => s.rung >= 4).length; // proxy + recent
  const comparisons = shops.filter(s => s.fastLane.comparison || s.rung >= 5).length;
  const commitments = shops.filter(s => s.rung >= 6).length;
  const submissions = shops.filter(s => s.rung >= 7).length;
  const fundings = shops.filter(s => s.rung >= 8).length;
  const lossesWithReason = state.data.feedback.filter(f => f.category === "reasons GVC loses").length + shops.reduce((n,s)=>n+(s.losses||[]).length,0);
  const secondAsks = shops.filter(s => s.fastLane.secondAsk || s.rung >= 9).length;
  const meter = (label, val, goal) => {
    const pct = Math.min(100, Math.round((val/goal)*100));
    return `<div class="kpi"><div class="n">${val}<span class="muted" style="font-size:14px"> / ${goal}</span></div><div class="l">${esc(label)}</div><div class="bar" style="margin-top:8px"><span style="width:${pct}%"></span></div></div>`;
  };
  return `<div class="view-head"><div><h1>Scoreboard</h1><p>30-day movement — not airtime.</p></div></div>
  <div class="grid grid-3" style="margin-bottom:12px">
    ${meter("Shops with dated next step", withNext, 11)}
    ${meter("Shops with 3+ relationships", relOk, 11)}
    ${meter("Meaningful convos / week", convos.length, 15)}
    ${meter("Scenarios in motion (rung≥4)", scenarios, 8)}
    ${meter("Comparisons done", comparisons, 4)}
    ${meter("First-file commitments (rung≥6)", commitments, 2)}
  </div>
  <div class="grid grid-2">
    <div class="card"><h3>Submissions & fundings by shop</h3>
      <table class="table"><thead><tr><th>Shop</th><th>Rung</th><th>Submitted</th><th>Funded</th><th>2nd ask</th></tr></thead>
      <tbody>${shops.map(s=>`<tr>
        <td>${esc(s.name)}</td><td>R${s.rung}</td>
        <td>${s.rung>=7?"✓":"—"}</td><td>${s.rung>=8?"✓":"—"}</td><td>${s.rung>=9||s.fastLane.secondAsk?"✓":"—"}</td>
      </tr>`).join("")}</tbody></table>
    </div>
    <div class="card"><h3>Loss & second-loan hygiene</h3>
      <div class="list">
        <div class="row"><div class="row-main"><strong>Losses with reason logged</strong><div class="muted">Feedback + shop loss records</div></div><span class="tag">${lossesWithReason}</span></div>
        <div class="row"><div class="row-main"><strong>Fundings with second-loan ask</strong></div><span class="tag ${secondAsks? "green":""}">${secondAsks} / ${fundings||0}</span></div>
        <div class="row"><div class="row-main"><strong>Active campaign</strong><div class="muted">${esc(state.data.campaign.type)}</div></div><span class="tag gold">live</span></div>
      </div>
    </div>
  </div>`;
}

  if (saveNewFb) saveNewFb.addEventListener("click", () => {
    state.data.feedback.unshift({ id: uid(), shopId: document.getElementById("fbShop").value, category: document.getElementById("fbCat").value, detail: document.getElementById("fbDetail").value, status: "open", response: "", created: isoDate() });

function dkReadForm(){
  ensureDoorKick(state.data);
  const shopId = document.getElementById("dkShop")?.value || state.dkShopId;
  const shop = state.data.shops.find(s => s.id === shopId) || state.data.shops[0];
  const rows = [];
  for (let i = 0; i < 5; i++) {
    const get = (f) => document.querySelector(`[data-dk-row="${i}"][data-dk-field="${f}"]`)?.value ?? "";
    rows.push({ product: get("product"), rate: get("rate"), points: get("points"), note: get("note") });
  }
  const opener = document.getElementById("dkOpener")?.value ?? "";
  const cta = document.getElementById("dkCta")?.value ?? "";
  const subject = document.getElementById("dkSubject")?.value ?? "";
  const asOf = document.getElementById("dkAsOf")?.value || isoDate();
  const attachNote = !!document.getElementById("dkAttach")?.checked;
  const guidelines = (document.getElementById("dkGuidelines")?.value || "").split("\n").map(s => s.trim()).filter(Boolean);
  return { shop, shopId, rows, opener, cta, subject, asOf, attachNote, guidelines };
}

function dkRefreshPreview(){
  if (!document.getElementById("dkPlainPreview")) return;
  const f = dkReadForm();
  const dk = state.data.doorKick;
  state.dkShopId = f.shopId;
  state.dkOpener = f.opener;
  state.dkCta = f.cta;
  state.dkSubject = f.subject;
  state.dkAsOf = f.asOf;
  state.dkAttachNote = f.attachNote;
  state.dkGuidelines = f.guidelines.join("\n");
  // live-edit products in memory (not persisted until Save defaults / Log)
  f.rows.forEach((r,i) => { if (dk.products[i]) Object.assign(dk.products[i], r); else dk.products[i] = r; });
  const plain = buildDoorKickPlain(f.shop.name, f.opener, f.cta, f.subject, f.rows, f.guidelines, f.attachNote, f.asOf, dk.compliance, dk.rateBlockLabel);
  const html = buildDoorKickHtml(f.shop.name, f.opener, f.cta, f.rows, f.guidelines, f.attachNote, f.asOf, dk.compliance, dk.rateBlockLabel);
  document.getElementById("dkPlainPreview").textContent = plain;
  document.getElementById("dkHtmlPreview").innerHTML = html;
}

async function dkCopy(text, label){
  const status = document.getElementById("dkStatus");
  try {
    await navigator.clipboard.writeText(text);
    if (status) status.textContent = "Copied " + label + ".";
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); if (status) status.textContent = "Copied " + label + "."; }
    catch { if (status) status.textContent = "Copy failed — select from preview."; }
    ta.remove();
  }
}

function bindDoorKick(){
  if (!document.getElementById("dkShop")) return;
  const refresh = () => dkRefreshPreview();
  document.getElementById("dkShop").addEventListener("change", () => {
    state.dkShopId = document.getElementById("dkShop").value;
    state.dkOpener = null; // re-personalize opener for new shop
    state.dkSubject = null;
    render();
  });
  ["dkOpener","dkCta","dkSubject","dkAsOf","dkGuidelines"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("input", refresh);
  });
  const att = document.getElementById("dkAttach");
  if (att) att.addEventListener("change", refresh);
  document.querySelectorAll("[data-dk-row]").forEach(el => el.addEventListener("input", refresh));

  document.getElementById("dkCopySubject")?.addEventListener("click", () => {
    const f = dkReadForm();
    dkCopy(f.subject, "subject");
  });
  document.getElementById("dkCopyPlain")?.addEventListener("click", () => {
    const f = dkReadForm();
    const dk = state.data.doorKick;
    const plain = buildDoorKickPlain(f.shop.name, f.opener, f.cta, f.subject, f.rows, f.guidelines, f.attachNote, f.asOf, dk.compliance, dk.rateBlockLabel);
    dkCopy(plain, "plain text");
  });
  document.getElementById("dkCopyHtml")?.addEventListener("click", () => {
    const f = dkReadForm();
    const dk = state.data.doorKick;
    const html = buildDoorKickHtml(f.shop.name, f.opener, f.cta, f.rows, f.guidelines, f.attachNote, f.asOf, dk.compliance, dk.rateBlockLabel);
    dkCopy(html, "HTML");
  });
  document.getElementById("dkSaveDefaults")?.addEventListener("click", () => {
    const f = dkReadForm();
    ensureDoorKick(state.data);
    state.data.doorKick.products = f.rows.map(r => ({...r}));
    state.data.doorKick.cta = f.cta;
    state.data.doorKick.subjectTemplate = f.subject.replace(f.shop.name, "{{SHOP}}");
    state.data.doorKick.guidelines = f.guidelines;
    state.data.doorKick.attachNote = f.attachNote;
    save();
    const status = document.getElementById("dkStatus");
    if (status) status.textContent = "Template defaults saved to localStorage.";
  });
  document.getElementById("dkLog")?.addEventListener("click", () => {
    const f = dkReadForm();
    const shop = f.shop;
    const filled = f.rows.filter(r => (r.product||"").trim()).map(r => r.product).join(", ");
    shop.nextStep = {
      what: "Follow up on door-kick reply",
      who: "Brock",
      date: addDays(2)
    };
    state.data.conversations.unshift({
      id: uid(),
      shopId: shop.id,
      at: isoDate(),
      outcome: "loan_moved",
      notes: "Door-kick body email sent (" + (filled || "rate doors") + "). Subject: " + f.subject + ". CTA: " + f.cta,
      rungAfter: shop.rung,
      next: {...shop.nextStep},
      meaningful: true
    });
    // persist current rows as working defaults
    ensureDoorKick(state.data);
    state.data.doorKick.products = f.rows.map(r => ({...r}));
    state.data.doorKick.cta = f.cta;
    save();
    const status = document.getElementById("dkStatus");
    if (status) status.textContent = "Logged door-kick on " + shop.name + " · next step +2 days (Brock).";
    else { state.view = "shops"; state.selectedShopId = shop.id; render(); }
  });
}


function openLog(){
  const sel = document.getElementById("logShop");
  sel.innerHTML = state.data.shops.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("");
  const rung = document.getElementById("logRung");
  rung.innerHTML = `<option value="">— no change —</option>` + RUNGS.map((n,i)=>`<option value="${i+1}">${i+1}. ${esc(n)}</option>`).join("");
  document.getElementById("logDate").value = addDays(2);
  document.getElementById("logOwner").value = "Brock";
  document.getElementById("modalLog").classList.remove("hidden");
}
function closeLog(){ document.getElementById("modalLog").classList.add("hidden"); }

function boot(){
  state.data = load();
  save();
  document.getElementById("nav").addEventListener("click", e => {
    const btn = e.target.closest("[data-view]");
    if (!btn) return;
    state.view = btn.getAttribute("data-view");
    render();
  });
  document.getElementById("btnLog").onclick = openLog;
  document.getElementById("closeLog").onclick = closeLog;
  document.getElementById("cancelLog").onclick = closeLog;
  document.getElementById("formLog").onsubmit = e => {
    e.preventDefault();
    const shopId = document.getElementById("logShop").value;
    const shop = state.data.shops.find(s => s.id === shopId);
    const rungVal = document.getElementById("logRung").value;
    if (rungVal) shop.rung = +rungVal;
    shop.nextStep = {
      what: document.getElementById("logNext").value.trim(),
      who: document.getElementById("logOwner").value.trim(),
      date: document.getElementById("logDate").value
    };
    const outcome = document.getElementById("logOutcome").value;
    const notes = document.getElementById("logNotes").value.trim();
    state.data.conversations.unshift({
      id: uid(), shopId, at: isoDate(), outcome, notes, rungAfter: shop.rung, next: {...shop.nextStep},
      meaningful: true
    });
    if (outcome === "feedback" && notes) {
      state.data.feedback.unshift({ id: uid(), shopId, category: "repeated requests", detail: notes, status: "open", response: "", created: isoDate() });
    }
    save(); closeLog(); state.view = "today"; render();
  };
  document.getElementById("btnExport").onclick = () => {
    const blob = new Blob([JSON.stringify(state.data,null,2)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "gvc-tpo-command-center.json"; a.click();
  };
  document.getElementById("btnImport").onclick = () => document.getElementById("importFile").click();
  document.getElementById("importFile").onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    state.data = ensureDoorKick(ensureUpdates(JSON.parse(await file.text()))); save(); render();
  };
  document.getElementById("btnReset").onclick = () => {
    if (confirm("Reset to seeded 11 shops? This clears local data.")) {
      state.data = seedData(); save(); render();
    }
  };
  render();
}
boot();
</script>
</body>
</html>
